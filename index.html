<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
                
    </head>
    <body>
        <div class="container">
            <div>
                <h3>Team 1</h3>
                <div class="scoreboard">
                    <h4 id="score-H">0</h4>
                </div>
                <div class="points-button">
                    <button class="points" onclick="plusOneHome()">+1</button>
                    <button class="points" onclick="plusTwoHome()">+2</button>
                    <button class="points" onclick="plusThreeHome()">+3</button>
                </div>
            </div>
            <div>
                <h3>Team 2</h3>
                <div class="scoreboard">
                    <h4 id="score-A">0</h4>
                </div>
                <div class="points-button">
                    <button class="points" onclick="plusOneAway()">+1</button>
                    <button class="points" onclick="plusTwoAway()">+2</button>
                    <button class="points" onclick="plusThreeAway()">+3</button>
                     
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
